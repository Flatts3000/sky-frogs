name: Validate Quests

# Layer 1 of docs/quest_testing.md: blocks any PR/push that ships a quest-data bug
# (tier-skip exploit, dangling dependency, negative-leading id, em-dash, etc.).

on:
  pull_request:
    paths:
      - "pack/config/ftbquests/**"
      - "pack/kubejs/**"
      # tools/*.py, not just validate_quests.py: the validator imports pf_jar,
      # gen_completionist_chapters and ironjetpacks_tiers, so pinning the trigger to
      # the entry point alone let a change to a CHECK'S DATA SOURCE skip CI. The job
      # is a few seconds; triggering on an unrelated tool edit is the cheaper mistake.
      - "tools/*.py"
      - "tools/data/item_ids.txt"
  push:
    branches: [main]
    paths:
      - "pack/config/ftbquests/**"
      - "pack/kubejs/**"
      # tools/*.py, not just validate_quests.py: the validator imports pf_jar,
      # gen_completionist_chapters and ironjetpacks_tiers, so pinning the trigger to
      # the entry point alone let a change to a CHECK'S DATA SOURCE skip CI. The job
      # is a few seconds; triggering on an unrelated tool edit is the cheaper mistake.
      - "tools/*.py"
      - "tools/data/item_ids.txt"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate FTB Quests data
        run: python tools/validate_quests.py
